include /etc/nginx/mime.types;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 500m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Resolve Compose service names at request time so Nginx can start before its upstreams.
    set $backend_upstream http://backend:8080;
    set $minio_upstream http://minio:9000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets handling
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to backend Spring Boot container
    location /api/ {
        # $uri đã được Nginx chuẩn hóa nên /api/v1//public/... không bị chuyển nguyên trạng sang Spring.
        proxy_pass $backend_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Support chat STOMP/WebSocket realtime channel.
    location /ws/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy MinIO requests
    location /ailms-minio/ {
        proxy_pass $minio_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
